<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Intro to CSS and Selectors</title>
    <!--Internal CSS/Embedded CSS-->
    <style>
      /* p {
        color: blue;
        font-size: 24px;
      }
      */
    </style>
    <link rel="stylesheet" href="./lecture1.css" />
  </head>
  <body>
    <!--Inline CSS-->
    <p>The CSS of this content will be applied using Inline CSS</p>

    <!--Selectors-->
    <!--Element Selector-->
    <h2>The CSS of this content will be applied using Inline CSS</h2>

    <!--Class Selector-->
    <h2 class="orange red-background">
      The CSS of this content will be applied using Inline CSS
    </h2>

    <!--ID Selector-->
    <section>The CSS of this content will be applied using Inline CSS</section>
  </body>
</html>
