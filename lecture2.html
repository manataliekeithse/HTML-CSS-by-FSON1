<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>State Pseudo Class</title>

    <link rel="stylesheet" href="./css/lecture2.css" />
  </head>
  <body>
    <!--Pseudo Class on Social links-->
    <ul class="social-links">
      <li>
        <a
          class="link"
          href="https://twitter.com"
          target="_blank"
          rel="noopener noreferrer"
          >Twitter</a
        >
      </li>
      <li>
        <a
          class="link"
          href="https://www.instagram.com"
          target="_blank"
          rel="noopener noreferrer"
          >Instagram</a
        >
      </li>
      <li>
        <a
          class="link"
          href="https://www.facebook.com"
          target="_blank"
          rel="noopener noreferrer"
          >Facebook</a
        >
      </li>
    </ul>
  </body>
</html>
